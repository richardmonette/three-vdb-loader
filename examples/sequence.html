<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three-vdb-loader - animation</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link rel="stylesheet" href="demo.css">
	</head>

	<body>
		<div id="info">three-vdb-loader</div>
		<div id="nav"><a href="index.html">demos</a> | animation | <a href="volumes.html">volumes</a> | <a href="surface.html">surfaces</a></div>

		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
				}
			}
		</script>

		<script type="module">

			// A 192 frame NanoVDB fire simulation, streamed and decoded in web workers while it plays.

			import { startVolumeDemo } from './volume.js';

			// Rendering as in the simulator's oil_fire_column profile: soot extinction 20 per domain length (96 cells), albedo 0.25,
			// sun (12, 11, 9) from the right, ambient (0.4, 0.42, 0.46), emission 0.3, AgX with saturation 1.8.
			const fire = { sequence: true, grids: [ 'density', 'temperature' ], view: 'fire', extinction: 20, cells: 96, albedo: 0.25, emission: 0.3, light: [ 0.8, 0.5, - 0.3 ], lightColor: [ 12, 11, 9 ], ambient: [ 0.4, 0.42, 0.46 ], saturation: 1.8 };

			startVolumeDemo( {
				'oil fire, 192 frames, fp8 (31 MB)': { url: 'models/sequences/fire_fp8/fire_fp8.json', ...fire },
				'oil fire, 192 frames, fp4 (16 MB)': { url: 'models/sequences/fire_fp4/fire_fp4.json', ...fire }
			} );

		</script>
	</body>
</html>
