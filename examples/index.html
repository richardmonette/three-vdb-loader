<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three-vdb-loader</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<style>
			body {
				margin: 0;
				background: #2b3a4a;
				color: #fff;
				font-family: monospace;
				font-size: 13px;
			}

			#info {
				position: absolute;
				top: 10px;
				width: 100%;
				text-align: center;
				pointer-events: none;
			}
		</style>
	</head>

	<body>
		<div id="info">three-vdb-loader</div>

		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
					"fflate": "https://cdn.jsdelivr.net/npm/fflate@0.8.3/esm/browser.js"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
			import { VDBLoader } from '../VDBLoader.js';

			const openvdb = 'https://media.githubusercontent.com/media/AcademySoftwareFoundation/openvdb-website/master/download/models/';

			const models = {
				'torus knot': { url: 'models/torusknot.vdb', grid: 'density', threshold: 0.3, range: 0.2, opacity: 0.05 },
				'smoke (openvdb.org)': { url: openvdb + 'smoke.vdb', grid: 'density', threshold: 0.1, range: 0.1, opacity: 0.03 },
				'smoke2 (openvdb.org)': { url: openvdb + 'smoke2.vdb', grid: 'density', threshold: 0.02, range: 0.02, opacity: 0.08 },
				'smoke2 velocity (openvdb.org)': { url: openvdb + 'smoke2.vdb', grid: 'v', view: 'direction', scale: 0.05, threshold: 0.15, range: 0.1, opacity: 0.04 },
				'fire (openvdb.org)': { url: openvdb + 'fire.vdb', grid: 'temperature', view: 'blackbody', scale: 0.025, threshold: 0.05, range: 0.05, opacity: 0.06 }
			};

			const views = {
				scalar: [ 'flat', 'blackbody' ],
				vector: [ 'magnitude', 'direction' ]
			};

			const modes = { flat: 0, magnitude: 0, blackbody: 1, direction: 2 };

			const parameters = { model: 'torus knot', view: 'flat', threshold: 0, range: 0, opacity: 0, steps: 100 };

			const info = document.getElementById( 'info' );

			const renderer = new THREE.WebGLRenderer();
			renderer.setPixelRatio( window.devicePixelRatio );
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.setAnimationLoop( animate );
			document.body.appendChild( renderer.domElement );

			const scene = new THREE.Scene();
			scene.background = new THREE.Color( 0x2b3a4a );

			const camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.1, 100 );

			const controls = new OrbitControls( camera, renderer.domElement );
			controls.autoRotate = true;

			let mesh = null;

			const gui = new GUI();
			gui.add( parameters, 'model', Object.keys( models ) ).onChange( load );
			let viewController = gui.add( parameters, 'view', views.scalar ).onChange( update );
			gui.add( parameters, 'threshold', 0, 1, 0.01 ).onChange( update );
			gui.add( parameters, 'range', 0, 1, 0.01 ).onChange( update );
			gui.add( parameters, 'opacity', 0, 1, 0.01 ).onChange( update );
			gui.add( parameters, 'steps', 0, 400, 1 ).onChange( update );

			load();

			window.addEventListener( 'resize', onWindowResize );

			async function load() {

				const model = models[ parameters.model ];

				info.textContent = 'loading ' + parameters.model + '...';

				const grids = await new VDBLoader().setGridNames( [ model.grid ] ).loadAsync( model.url );
				const grid = grids[ 0 ];

				if ( mesh !== null ) {

					scene.remove( mesh );
					mesh.material.uniforms.map.value.dispose();
					mesh.material.dispose();

				}

				const center = grid.bbox.getCenter( new THREE.Vector3() );
				const size = grid.bbox.getSize( new THREE.Vector3() ).addScalar( 1 );

				mesh = new THREE.Mesh( new THREE.BoxGeometry( 1, 1, 1 ), createMaterial( grid.texture, model ) );
				mesh.matrixAutoUpdate = false;
				mesh.matrix.copy( grid.transform ).multiply( new THREE.Matrix4().makeTranslation( center ).scale( size ) );
				mesh.updateMatrixWorld( true );
				scene.add( mesh );

				const box = new THREE.Box3().setFromObject( mesh );
				const radius = box.getSize( new THREE.Vector3() ).length() / 2;

				box.getCenter( controls.target );
				camera.position.copy( controls.target ).add( new THREE.Vector3( 0, 0, radius * 2 ) );
				camera.near = radius / 100;
				camera.far = radius * 10;
				camera.updateProjectionMatrix();

				const type = grid.texture.format === THREE.RGBAFormat ? 'vector' : 'scalar';

				parameters.view = model.view ?? views[ type ][ 0 ];
				parameters.threshold = model.threshold;
				parameters.range = model.range;
				parameters.opacity = model.opacity;
				viewController = viewController.options( views[ type ] ).onChange( update );
				gui.controllersRecursive().forEach( c => c.updateDisplay() );

				update();

				const image = grid.texture.image;
				info.textContent = parameters.model + ' - ' + grid.name + ' - ' + image.width + 'x' + image.height + 'x' + image.depth;

			}

			function update() {

				if ( mesh === null ) return;

				mesh.material.uniforms.mode.value = modes[ parameters.view ];
				mesh.material.uniforms.threshold.value = parameters.threshold;
				mesh.material.uniforms.range.value = parameters.range;
				mesh.material.uniforms.opacity.value = parameters.opacity;
				mesh.material.uniforms.steps.value = parameters.steps;

			}

			function createMaterial( texture, model ) {

				const vertexShader = /* glsl */`
					in vec3 position;

					uniform mat4 modelMatrix;
					uniform mat4 modelViewMatrix;
					uniform mat4 projectionMatrix;
					uniform vec3 cameraPos;

					out vec3 vOrigin;
					out vec3 vDirection;

					void main() {

						vec4 mvPosition = modelViewMatrix * vec4( position, 1.0 );

						vOrigin = vec3( inverse( modelMatrix ) * vec4( cameraPos, 1.0 ) ).xyz;
						vDirection = position - vOrigin;

						gl_Position = projectionMatrix * mvPosition;

					}
				`;

				const fragmentShader = /* glsl */`
					precision highp float;
					precision highp sampler3D;

					in vec3 vOrigin;
					in vec3 vDirection;

					out vec4 color;

					uniform vec3 base;
					uniform sampler3D map;
					uniform bool vector;
					uniform float scale;
					uniform int mode;

					uniform float threshold;
					uniform float range;
					uniform float opacity;
					uniform float steps;

					vec2 hitBox( vec3 orig, vec3 dir ) {

						vec3 invDir = 1.0 / dir;
						vec3 tminTmp = ( vec3( - 0.5 ) - orig ) * invDir;
						vec3 tmaxTmp = ( vec3( 0.5 ) - orig ) * invDir;
						vec3 tmin = min( tminTmp, tmaxTmp );
						vec3 tmax = max( tminTmp, tmaxTmp );
						return vec2( max( tmin.x, max( tmin.y, tmin.z ) ), min( tmax.x, min( tmax.y, tmax.z ) ) );

					}

					vec3 blackbody( float t ) {

						float k = mix( 10.0, 40.0, clamp( t, 0.0, 1.0 ) );

						return clamp( vec3(
							1.0,
							0.390081578769 * log( k ) - 0.631841443788,
							k <= 19.0 ? 0.0 : 0.543206789110 * log( k - 10.0 ) - 1.19625408914
						), 0.0, 1.0 ) * t;

					}

					float density( vec4 value ) {

						return smoothstep( threshold - range, threshold + range, ( vector ? length( value.rgb ) : value.r ) * scale );

					}

					vec3 shade( vec4 value ) {

						if ( mode == 1 ) return blackbody( value.r * scale ) * 2.0;
						if ( mode == 2 ) return 0.5 + 0.5 * normalize( value.rgb + 1e-6 );

						return base;

					}

					void main() {

						vec3 rayDir = normalize( vDirection );
						vec2 bounds = hitBox( vOrigin, rayDir );

						if ( bounds.x > bounds.y ) discard;

						bounds.x = max( bounds.x, 0.0 );

						float stepSize = ( bounds.y - bounds.x ) / steps;
						float jitter = fract( sin( dot( gl_FragCoord.xy, vec2( 12.9898, 78.233 ) ) ) * 43758.5453 );
						vec3 p = vOrigin + ( bounds.x + jitter * stepSize ) * rayDir;

						vec4 ac = vec4( 0.0 );

						for ( float i = 0.0; i < steps; i += 1.0 ) {

							vec4 value = texture( map, p + 0.5 );
							float d = density( value ) * opacity;

							ac.rgb += ( 1.0 - ac.a ) * d * shade( value );
							ac.a += ( 1.0 - ac.a ) * d * ( mode == 1 ? 0.5 : 1.0 );

							if ( ac.a >= 0.95 ) break;

							p += rayDir * stepSize;

						}

						color = ac;

						if ( color.a == 0.0 ) discard;

					}
				`;

				return new THREE.RawShaderMaterial( {
					glslVersion: THREE.GLSL3,
					uniforms: {
						base: { value: new THREE.Color( 0xf0e0d0 ) },
						map: { value: texture },
						vector: { value: texture.format === THREE.RGBAFormat },
						scale: { value: model.scale ?? 1 },
						mode: { value: 0 },
						cameraPos: { value: new THREE.Vector3() },
						threshold: { value: 0 },
						range: { value: 0 },
						opacity: { value: 0 },
						steps: { value: 0 }
					},
					vertexShader,
					fragmentShader,
					side: THREE.BackSide,
					transparent: true,
					premultipliedAlpha: true
				} );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				controls.update();

				if ( mesh !== null ) mesh.material.uniforms.cameraPos.value.copy( camera.position );

				renderer.render( scene, camera );

			}

		</script>

	</body>
</html>
